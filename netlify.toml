[build]
  publish = "."
  # Rewrites sitemap.xml with real per-page dates from git (see README.md).
  command = "node scripts/sitemap.mjs --netlify"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/brochure.html"
  to = "/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
